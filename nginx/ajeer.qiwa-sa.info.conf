# Upstream Next.js Server running on Docker container port 3003
upstream ajeer_upstream {
    server 127.0.0.1:3003;
    keepalive 32;
}

# 1. HTTP Configuration (Port 80) - ACME Challenge & Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ajeer.qiwa-sa.info;

    # ACME Challenge directory for Let's Encrypt / Certbot SSL renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Configuration (Port 443) - Reverse Proxy to Next.js App
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ajeer.qiwa-sa.info;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/ajeer.qiwa-sa.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ajeer.qiwa-sa.info/privkey.pem;

    # SSL Security Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Request Body Size (for permits, uploads)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Next.js Static Asset Caching (immutable)
    location /_next/static/ {
        proxy_pass http://ajeer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static media files
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://ajeer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Main Reverse Proxy Location
    location / {
        proxy_pass http://ajeer_upstream;
        proxy_http_version 1.1;

        # WebSocket & Keepalive Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client IP & Protocol Pass-through
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}